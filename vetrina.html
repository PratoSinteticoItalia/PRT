<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vetrina — Prato Sintetico Italia</title>
    <link rel="icon" href="/logo-prato.png" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      :root {
        --brand: #2d6a4f;
        --brand-dark: #1b4332;
        --brand-soft: #d8f3dc;
        --brand-xsoft: #f1f8f3;
        --ink: #16241c;
        --muted: #64766c;
        --line: #e3ece5;
        --paper: #ffffff;
        --amber: #d97706;
        --amber-soft: #fef3c7;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; background: var(--paper);
        overflow: hidden; font-family: "DM Sans", sans-serif; cursor: none;
      }
      body.show-cursor { cursor: default; }
      .num { font-variant-numeric: tabular-nums; }

      #stage { position: fixed; inset: 0; background: var(--paper); }
      .layer { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .5s ease; }
      .layer.active { opacity: 1; z-index: 2; }
      .slide-inner { position: absolute; inset: 0; }

      /* ---------- sfondo animato condiviso dalle slide "di passaggio" ---------- */
      .mesh-bg {
        position: absolute; inset: 0; background: var(--brand-dark); overflow: hidden;
      }
      .mesh-bg::before, .mesh-bg::after {
        content: ""; position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55;
        animation: meshDrift 24s ease-in-out infinite;
      }
      .mesh-bg::before { width: 52vw; height: 52vw; background: var(--brand); top: -18%; left: -12%; }
      .mesh-bg::after { width: 42vw; height: 42vw; background: #40916c; bottom: -20%; right: -10%; animation-duration: 19s; animation-delay: -8s; }
      @keyframes meshDrift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, -4%) scale(1.1); } }
      .ghost-icon {
        position: absolute; right: -4%; bottom: -10%; width: 46vh; height: 46vh; opacity: .1;
        color: #fff; pointer-events: none;
      }
      .ghost-icon svg { width: 100%; height: 100%; }
      .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .particle {
        position: absolute; bottom: -8%; width: 7px; height: 7px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% { transform: translateY(0) scale(.7); opacity: 0; }
        12% { opacity: .65; }
        85% { opacity: .5; }
        100% { transform: translateY(-108vh) scale(1.3); opacity: 0; }
      }

      /* ---------- template: divisore categoria ---------- */
      .tpl-divider {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; text-align: center; gap: .6rem;
      }
      .tpl-divider .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
      .tpl-divider .eyebrow { font: 700 .85rem "DM Sans"; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
      .tpl-divider .cat-name { font: 600 clamp(2.4rem, 5.4vw, 4.4rem)/1.05 "Fraunces", serif; letter-spacing: -.01em; }
      .tpl-divider .cat-count { font: 500 1.1rem "DM Sans"; opacity: .85; }

      /* ---------- template: prodotto (foto ambientata a sinistra, campione grande a destra) ---------- */
      .tpl-product { position: absolute; inset: 0; display: flex; background: var(--paper); }
      .product-immersive { position: relative; flex: 1 1 55%; overflow: hidden; background: #0c130f; }
      .product-immersive > img {
        position: absolute; inset: -7%; width: 114%; height: 114%; object-fit: cover;
        object-position: center; animation: kenBurnsSlow 9.5s ease-out both; transform-origin: center;
      }
      .product-panel {
        position: relative; z-index: 2; flex: 0 0 45%; max-width: 45%;
        display: flex; flex-direction: column; justify-content: center; gap: 1rem;
        padding: 4vh 3.6vw 4vh 2.4vw; background: var(--paper); border-left: 1px solid var(--line);
      }
      .swatch-frame {
        width: 100%; aspect-ratio: 16 / 11; border-radius: 16px; overflow: hidden;
        border: 1px solid var(--line); box-shadow: 0 20px 34px rgba(22,36,28,.16); background: #fff;
        margin-bottom: .3rem; padding: 4%;
      }
      /* contain, non cover: alcune foto prodotto non sono tutte nello stesso
         formato — meglio vedere il prodotto intero che tagliarne un pezzo. */
      .swatch-frame img { width: 100%; height: 100%; object-fit: contain; }
      .panel-header { display: flex; align-items: center; gap: 1rem; margin-bottom: .2rem; }
      .index-label { font: 600 .78rem "DM Sans"; letter-spacing: .1em; color: var(--muted); }
      .cat-pill {
        display: inline-flex; align-items: center; gap: .5em;
        color: var(--brand); font: 700 .74rem "DM Sans"; letter-spacing: .14em; text-transform: uppercase;
      }
      .cat-pill::before { content: ""; width: 1.3em; height: 1.5px; background: var(--brand); display: inline-block; }
      .name-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .15rem; }
      .product-name {
        flex: 1 1 auto; min-width: 0; font: 500 clamp(2rem, 3vw, 2.7rem)/1.08 "Fraunces", serif;
        color: var(--ink); margin: 0; letter-spacing: -.01em;
      }
      .product-desc { font: 400 1.05rem/1.5 "DM Sans"; color: var(--muted); max-width: 32ch; margin: 0; }
      .product-price { display: flex; align-items: baseline; gap: .4em; }
      .product-price .amount { font: 700 clamp(2rem, 3.4vw, 2.8rem)/1 "DM Sans"; color: var(--brand); }
      .product-price .unit { font: 600 .9rem "DM Sans"; color: var(--muted); }
      .spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
      .spec-item { display: flex; flex-direction: column; gap: .2rem; }
      .spec-item .k { font: 700 .64rem "DM Sans"; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
      .spec-item .v { font: 600 .95rem "DM Sans"; color: var(--ink); }
      .qr-badge {
        flex: none; display: flex; align-items: center; gap: .5rem;
        background: #fff; border: 1px solid var(--line); border-radius: 12px;
        padding: .4rem .7rem .4rem .4rem; box-shadow: 0 10px 20px rgba(22,36,28,.12);
      }
      .qr-badge .qr-code { width: 44px; height: 44px; line-height: 0; }
      .qr-badge .qr-code img { width: 100%; height: 100%; }
      .qr-badge .qr-copy { display: flex; flex-direction: column; gap: .05rem; max-width: 9ch; }
      .qr-badge .qr-title { font: 700 .62rem "DM Sans"; color: var(--ink); line-height: 1.15; }
      .qr-badge .qr-sub { font: 500 .56rem "DM Sans"; color: var(--muted); line-height: 1.15; }

      @keyframes slideInRight { from { opacity: 0; transform: translateX(6%); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideOutLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-6%); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(2.5%); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes zoomSoft { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
      @keyframes kenBurnsSlow { from { transform: scale(1); } to { transform: scale(1.12); } }

      /* ---------- template: realizzazione (sobria) ---------- */
      .tpl-realizzazione { position: absolute; inset: 0; overflow: hidden; background: #0c130f; }
      .tpl-realizzazione img { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; }
      .tpl-realizzazione .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(10,20,14,.72) 0%, rgba(10,20,14,.15) 32%, transparent 55%);
      }
      .tpl-realizzazione .copy { position: absolute; left: 4.5%; bottom: 6%; right: 4.5%; color: #fff; display: flex; align-items: center; gap: .9rem; }
      .real-pill {
        display: inline-flex; align-items: center; padding: .38em 1em; border-radius: 999px;
        background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(6px);
        font: 700 .72rem "DM Sans"; letter-spacing: .08em; text-transform: uppercase;
      }
      .real-title { font: 600 1.4rem "DM Sans"; margin: 0; }

      /* ---------- template: stat ---------- */
      .tpl-stat {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; text-align: center; gap: .4rem;
      }
      .tpl-stat .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: .4rem; }
      .stat-icon { width: 3.2rem; height: 3.2rem; margin-bottom: .6rem; opacity: .9; }
      .tpl-stat .num { font: 700 clamp(5rem, 11vw, 9rem)/1 "DM Sans"; font-variant-numeric: tabular-nums; }
      .tpl-stat .lbl { font: 600 clamp(1rem, 1.6vw, 1.4rem)/1.3 "DM Sans"; color: rgba(255,255,255,.78); text-transform: uppercase; letter-spacing: .05em; }

      /* ---------- template: quote ---------- */
      .tpl-quote {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; padding: 0 10%; text-align: center;
      }
      .tpl-quote .content { position: relative; z-index: 2; }
      .quote-mark { font: 700 5rem/1 "Fraunces", serif; color: var(--brand-soft); opacity: .6; display: block; margin-bottom: -1rem; }
      .tpl-quote blockquote { margin: 0; font: 500 clamp(1.7rem, 3.2vw, 2.7rem)/1.4 "Fraunces", serif; }

      /* ---------- template: tip ---------- */
      .tpl-tip {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; text-align: center; gap: 1rem; padding: 0 12%;
      }
      .tpl-tip .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 46ch; }
      .tip-icon { width: 3.4rem; height: 3.4rem; opacity: .95; }
      .tip-eyebrow { font: 700 .8rem "DM Sans"; letter-spacing: .18em; text-transform: uppercase; color: var(--brand-soft); }
      .tip-text { font: 500 clamp(1.4rem, 2.4vw, 2rem)/1.45 "Fraunces", serif; }

      /* ---------- template: video-moment (clip di intermezzo, a piena pagina
         come le realizzazioni — deve essere protagonista, non un francobollo
         isolato nel vuoto) ---------- */
      .tpl-video-moment { position: absolute; inset: 0; background: #0c130f; }
      /* Un solo <video> persistente sopra i layer (non uno nuovo per slide):
         le smart TV hanno pochi decoder e un elemento creato/distrutto a ogni
         slide li esaurisce. Niente loop, sfumature o blur sopra il video: ogni
         sovrapposizione obbliga la TV a ricomporre i frame uno per uno. */
      #tvVideo {
        position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000;
        z-index: 3; opacity: 0; visibility: hidden; transition: opacity .5s ease;
      }
      #tvVideo.on { opacity: 1; visibility: visible; }
      #tvVideoCopy {
        position: fixed; left: 4.5%; bottom: 6%; z-index: 4; display: none; align-items: center; color: #fff;
      }
      #tvVideoCopy.on { display: flex; }
      .video-pill {
        display: inline-flex; align-items: center; padding: .38em 1em; border-radius: 999px;
        background: rgba(10,20,14,.6); border: 1px solid rgba(216,243,220,.45);
        font: 700 .72rem "DM Sans"; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-soft);
      }
      .video-title {
        font: 600 1.5rem "DM Sans"; margin: 0 0 0 .9rem; padding: .3em .8em; border-radius: 10px;
        background: rgba(10,20,14,.62);
      }
      body.video-slide #progress, body.video-slide #clock { display: none; }
      /* Le animazioni dei layer non visibili (sfondi mesh, particelle) non
         servono: fermarle libera la GPU della TV. */
      .layer:not(.active) * { animation-play-state: paused !important; }

      /* ---------- template: bumper (logo) ---------- */
      .tpl-bumper {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; text-align: center; gap: 1.2rem;
      }
      .tpl-bumper .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
      .tpl-bumper img { width: clamp(110px, 13vw, 180px); animation: logoPulse 3.2s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(216,243,220,.35)); }
      .tpl-bumper .tagline { font: 500 clamp(1.2rem, 2.2vw, 1.8rem)/1.3 "Fraunces", serif; color: rgba(255,255,255,.85); max-width: 24ch; }
      @keyframes logoPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

      /* ---------- barra di progresso ---------- */
      #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--brand); z-index: 40; }

      /* ---------- orologio ---------- */
      #clock {
        position: fixed; top: 22px; right: 28px; z-index: 45; color: var(--muted);
        font: 600 1rem/1 "DM Sans"; letter-spacing: .04em; mix-blend-mode: normal;
      }
      .tpl-realizzazione ~ #clock, body.on-dark #clock { color: rgba(255,255,255,.7); }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        padding: 1rem 1.8rem; background: linear-gradient(0deg, rgba(10,20,14,.82), transparent);
        color: #fff; transform: translateY(100%); opacity: 0; transition: transform .35s ease, opacity .35s ease;
        pointer-events: none;
      }
      #hud.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
      #hud button {
        background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff;
        width: 44px; height: 44px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
      }
      #hud button:hover { background: rgba(255,255,255,.24); }
      #hud .cluster { display: flex; align-items: center; gap: .7rem; }
      #hud select, #hud input[type="range"] { accent-color: var(--brand-soft); }
      #hud select {
        background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
        border-radius: 8px; padding: .5em .7em; font: 500 .85rem "DM Sans", sans-serif;
      }
      #hud .count { font: 600 .85rem "DM Sans", sans-serif; opacity: .75; min-width: 3.5em; text-align: center; }

      /* ---------- overlay di avvio ---------- */
      #start-overlay {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.6rem; text-align: center; color: var(--brand-dark);
        background: var(--brand-xsoft); cursor: default;
      }
      #start-overlay img { width: clamp(120px, 14vw, 200px); }
      #start-overlay h1 { font: 800 clamp(1.6rem, 3vw, 2.6rem)/1.2 "DM Sans"; margin: 0; }
      #start-overlay p { font: 400 1.05rem "DM Sans"; color: var(--muted); margin: 0; max-width: 40ch; }
      #start-overlay button {
        margin-top: .6rem; padding: .95em 2.4em; border-radius: 999px; border: none; cursor: pointer;
        background: var(--brand); color: #fff; font: 700 1.05rem "DM Sans";
        box-shadow: 0 10px 30px rgba(45,106,79,.28);
      }
      #start-overlay.hidden { display: none; }

      @media (max-width: 900px) {
        .tpl-product { flex-direction: column; }
        .product-immersive { flex: 1 1 38%; }
        .product-panel { flex: 1 1 62%; max-width: 100%; padding: 2vh 6vw; border-left: none; border-top: 1px solid var(--line); }
      }
          #dbg {
        position: fixed; top: 8px; left: 8px; z-index: 200; margin: 0; padding: 6px 9px; max-width: 70vw;
        background: rgba(0,0,0,.72); color: #9fffa8; font: 12px/1.35 ui-monospace, Menlo, monospace;
        white-space: pre-wrap; pointer-events: none; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="layer" id="layerA"><div class="slide-inner"></div></div>
      <div class="layer" id="layerB"><div class="slide-inner"></div></div>
    </div>
    <div id="progress"></div>
    <div id="clock"></div>

    <div id="hud">
      <div class="cluster">
        <button id="btn-prev" title="Precedente">&#10094;</button>
        <button id="btn-play" title="Pausa/Riprendi">&#10074;&#10074;</button>
        <button id="btn-next" title="Successiva">&#10095;</button>
        <span class="count" id="hud-count">1/1</span>
      </div>
      <div class="cluster">
        <button id="btn-mute" title="Muto">&#128266;</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" style="width:120px" />
        <select id="station"></select>
      </div>
    </div>

    <div id="start-overlay">
      <img src="/showroom-content/logo.png" alt="Prato Sintetico Italia" />
      <h1>Vetrina Prato Sintetico Italia</h1>
      <p>Catalogo prodotti, realizzazioni e musica di sottofondo per lo showroom.</p>
      <button id="btn-start">Avvia la vetrina</button>
    </div>

    <audio id="audio" preload="none" crossorigin="anonymous"></audio>
    <video id="tvVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <div id="tvVideoCopy"></div>
    <pre id="dbg" hidden></pre>

    <script>
      const TRACKS = [
        { id: "handpan-1", name: "Relaxing Soft Handpan", url: "/showroom-content/music/handpan-1.mp3" },
        { id: "handpan-2", name: "Healing Handpan", url: "/showroom-content/music/handpan-2.mp3" },
        { id: "handpan-3", name: "Flowing Rivers Handpan", url: "/showroom-content/music/handpan-3.mp3" },
      ];
      const DURATIONS = { divider: 3200, product: 7500, realizzazione: 8500, stat: 6000, quote: 6500, tip: 6500, "video-moment": 16000, bumper: 4500 };
      const CATEGORY_ORDER = ["Residenziale", "Uso intensivo", "Animali domestici", "Terrazzi & Balconi"];

      const layerEls = [document.getElementById("layerA"), document.getElementById("layerB")];
      let activeLayerIdx = 0;
      let sequence = [];
      let seqPos = -1;
      let data = { brand: {}, coolStuff: [], collections: [], activeCollectionIds: null, realizzazioni: [], productPhotos: {}, videoMoments: [] };
      let playing = true;
      let advanceTimer = null;
      let wakeLock = null;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Solo le collezioni attive (scelte dall'ufficio in Impostazioni, o
      // tutte se non è mai stato configurato) entrano in sequenza. Dentro
      // ogni collezione, gli item restano raggruppati per categoria (ordine
      // fisso, sono dati strutturati) — solo le realizzazioni vengono
      // rimescolate ad ogni giro, senza mai mischiare le due sezioni.
      function buildSequence(d) {
        const seq = [];
        const activeCollections = Array.isArray(d.activeCollectionIds)
          ? d.collections.filter((c) => d.activeCollectionIds.includes(c.id))
          : d.collections;
        // Le clip video caricate girano una alla volta dopo ogni divisore di
        // categoria (round-robin, non a caso ad ogni giro come le
        // realizzazioni) — così anche con poche clip caricate si vedono
        // sparse per tutto il giro invece che ammassate in un punto solo.
        const videoPool = shuffle(d.videoMoments || []);
        let videoIdx = 0;
        activeCollections.forEach((coll) => {
          const byCategory = new Map();
          (coll.items || []).forEach((p) => {
            const key = p.category || "Altro";
            if (!byCategory.has(key)) byCategory.set(key, []);
            byCategory.get(key).push(p);
          });
          const orderedCats = coll.id === "prato-sintetico"
            ? [
                ...CATEGORY_ORDER.filter((c) => byCategory.has(c)),
                ...[...byCategory.keys()].filter((c) => !CATEGORY_ORDER.includes(c)),
              ]
            : [...byCategory.keys()];
          orderedCats.forEach((cat) => {
            const items = byCategory.get(cat);
            seq.push({ kind: "divider", data: { collection: coll.name, collectionId: coll.id, name: cat, count: items.length } });
            if (videoPool.length) {
              seq.push({ kind: "video-moment", data: videoPool[videoIdx % videoPool.length] });
              videoIdx++;
            }
            items.forEach((p) => seq.push({ kind: "product", data: p, collection: coll }));
          });
        });
        // Due elementi "cose fighe" scelti a caso ad ogni giro (non sempre
        // gli stessi due) come cuscinetto tra catalogo e realizzazioni.
        const cool = shuffle(d.coolStuff || []);
        if (cool[0]) seq.push({ kind: cool[0].type, data: cool[0] });
        seq.push({ kind: "bumper", data: d.brand });
        shuffle(d.realizzazioni || []).forEach((r) => seq.push({ kind: "realizzazione", data: r }));
        if (cool[1]) seq.push({ kind: cool[1].type, data: cool[1] });
        if (!seq.length) seq.push({ kind: "bumper", data: d.brand });
        return seq;
      }

      const ICONS = {
        leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c8-1 14-7 15-15-8 1-14 7-15 15Z"/><path d="M5 19c3-4 6-7 10-11"/></svg>',
        droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12Z"/></svg>',
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
        shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/></svg>',
        truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 7h11v9H2z"/><path d="M13 10h4l4 3v3h-8z"/><circle cx="6.2" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="17.2" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>',
        star: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.1 6.6.7-5 4.6 1.4 6.6-5.9-3.4-5.9 3.4 1.4-6.6-5-4.6 6.6-.7 2.9-6.1Z"/></svg>',
        spark: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c.6 4 3 6.4 7 7-4 .6-6.4 3-7 7-.6-4-3-6.4-7-7 4-.6 6.4-3 7-7Z"/></svg>',
        wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2-2 2.8-2.8Z"/></svg>',
        tree: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3 7 10h3l-4 6h4v5h4v-5h4l-4-6h3L12 3Z"/></svg>',
        vase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 3h6l1 4-2 2v9a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-9L8 7l1-4Z"/></svg>',
      };
      const COLLECTION_ICONS = { "prato-sintetico": "leaf", "accessori": "wrench", "verde-artificiale": "tree", "vasi-arredo": "vase" };
      function icon(name) { return ICONS[name] || ICONS.spark; }

      // Piccole particelle che salgono lentamente sullo sfondo delle slide di
      // passaggio — posizioni/tempi randomizzati ad ogni render per varietà.
      function particles(n) {
        let html = '<div class="particles">';
        for (let i = 0; i < n; i++) {
          const left = Math.round(Math.random() * 94 + 2);
          const delay = (Math.random() * -20).toFixed(1);
          const dur = (14 + Math.random() * 10).toFixed(1);
          html += `<span class="particle" style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s;"></span>`;
        }
        return html + "</div>";
      }

      function renderDivider(d) {
        const iconName = COLLECTION_ICONS[d.collectionId] || "leaf";
        return `
          <div class="tpl-divider">
            <div class="mesh-bg"></div>
            ${particles(10)}
            <div class="ghost-icon">${icon(iconName)}</div>
            <div class="content">
              <div class="eyebrow">${d.collection}</div>
              <div class="cat-name">${d.name}</div>
              <div class="cat-count">${d.count} modell${d.count === 1 ? "o" : "i"}</div>
            </div>
          </div>`;
      }

      // Foto ambientata a sinistra: priorità alla foto assegnata a mano dal
      // prodotto (pagina di caricamento), altrimenti pesca (in modo stabile,
      // non a caso ad ogni render) una foto dalle realizzazioni caricate —
      // così ogni prodotto è comunque affiancato da un cantiere vero finché
      // non gli si assegna la sua foto.
      function pickLifestyleImage(item, idx) {
        if (data.productPhotos[item.id]) return data.productPhotos[item.id];
        if (item.lifestyle) return item.lifestyle;
        if (!data.realizzazioni.length) return item.image;
        return data.realizzazioni[idx % data.realizzazioni.length].attachment?.url;
      }

      function renderProduct(p, idx) {
        const specs = p.specs || [];
        const num = String(idx + 1).padStart(2, "0");
        const total = sequence.filter((s) => s.kind === "product").length;
        const lifestyle = pickLifestyleImage(p, idx);
        return `
          <div class="tpl-product">
            <div class="product-immersive">
              <img src="${lifestyle}" alt="" />
            </div>
            <div class="product-panel">
              <div class="panel-header">
                <div class="index-label num">N. ${num} / ${total}</div>
                <span class="cat-pill">${p.category || ""}</span>
              </div>
              <div class="swatch-frame"><img src="${p.image}" alt="${p.name}" /></div>
              <div class="name-row">
                <h2 class="product-name">${p.name}</h2>
                ${p.url ? `
                  <div class="qr-badge">
                    <div class="qr-code" data-qr-url="${p.url}"></div>
                    <div class="qr-copy"><span class="qr-title">Scopri di più</span><span class="qr-sub">inquadra il codice</span></div>
                  </div>` : ""}
              </div>
              <p class="product-desc">${p.description || ""}</p>
              <div class="product-price"><span class="amount num">€${p.price}</span><span class="unit">${p.priceUnit || ""}</span></div>
              <div class="spec-row">
                ${specs.map((s) => `<div class="spec-item"><span class="k">${s.k}</span><span class="v">${s.v}</span></div>`).join("")}
              </div>
            </div>
          </div>`;
      }

      function renderRealizzazione(r) {
        return `
          <div class="tpl-realizzazione">
            <img src="${r.attachment?.url || r.image}" alt="${r.title || ""}" />
            <div class="scrim"></div>
            <div class="copy">
              <span class="real-pill">Realizzazione</span>
              <p class="real-title">${r.title || ""}</p>
            </div>
          </div>`;
      }

      function renderStat(d) {
        const m = String(d.value).match(/^(\d+)/);
        const target = m ? m[1] : "0";
        const suffix = m ? String(d.value).slice(m[1].length) : String(d.value);
        return `
          <div class="tpl-stat">
            <div class="mesh-bg"></div>
            ${particles(8)}
            <div class="content">
              <div class="stat-icon">${icon(d.icon)}</div>
              <div class="num" data-target="${target}" data-suffix="${suffix}">0</div>
              <div class="lbl">${d.label}</div>
            </div>
          </div>`;
      }
      function renderQuote(d) {
        return `
          <div class="tpl-quote">
            <div class="mesh-bg"></div>
            ${particles(8)}
            <div class="content">
              <span class="quote-mark">"</span>
              <blockquote>${d.text}</blockquote>
            </div>
          </div>`;
      }
      function renderTip(d) {
        return `
          <div class="tpl-tip">
            <div class="mesh-bg"></div>
            ${particles(10)}
            <div class="content">
              <div class="tip-icon">${icon(d.icon)}</div>
              <div class="tip-eyebrow">Lo sapevi?</div>
              <div class="tip-text">${d.text}</div>
            </div>
          </div>`;
      }
      // Il video vero sta nell'elemento persistente #tvVideo (vedi startTvVideo):
      // il layer contiene solo lo sfondo scuro su cui appare.
      function renderVideoMoment() {
        return '<div class="tpl-video-moment"></div>';
      }

      function renderBumper(brand) {
        return `
          <div class="tpl-bumper">
            <div class="mesh-bg"></div>
            ${particles(10)}
            <div class="content">
              <img src="${brand.logoWhite || brand.logo}" alt="${brand.name || ""}" />
              <div class="tagline">${brand.tagline || ""}</div>
            </div>
          </div>`;
      }

      function animateStatCountUp(root) {
        const el = root.querySelector(".num[data-target]");
        if (!el) return;
        const target = Number(el.dataset.target) || 0;
        const suffix = el.dataset.suffix || "";
        const duration = 1400;
        const start = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * eased).toLocaleString("it-IT") + suffix;
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      // QRCode.js disegna nel DOM al momento della chiamata: va rifatto ad
      // ogni slide (l'elemento .qr-code è sempre nuovo, essendo innerHTML
      // rigenerato ogni volta). Se la libreria non è disponibile (rete
      // assente al primo avvio) il badge resta vuoto invece di rompere tutto.
      function renderQrCode(root) {
        const el = root.querySelector(".qr-code[data-qr-url]");
        if (!el || typeof QRCode === "undefined") return;
        try {
          new QRCode(el, {
            text: el.dataset.qrUrl,
            width: 64,
            height: 64,
            colorDark: "#16241c",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M,
          });
        } catch (_) {}
      }

      function renderSlide(item) {
        if (item.kind === "divider") return { kind: "divider", html: renderDivider(item.data), dark: true };
        if (item.kind === "product") {
          const productItems = sequence.filter((s) => s.kind === "product");
          return { kind: "product", html: renderProduct(item.data, productItems.indexOf(item)), dark: false };
        }
        if (item.kind === "realizzazione") return { kind: "realizzazione", html: renderRealizzazione(item.data), dark: true };
        if (item.kind === "stat") return { kind: "stat", html: renderStat(item.data), dark: true };
        if (item.kind === "quote") return { kind: "quote", html: renderQuote(item.data), dark: true };
        if (item.kind === "tip") return { kind: "tip", html: renderTip(item.data), dark: true };
        if (item.kind === "video-moment") return { kind: "video-moment", html: renderVideoMoment(item.data), dark: true };
        return { kind: "bumper", html: renderBumper(item.data), dark: true };
      }

      const ENTER_BY_KIND = {
        product: "slideInRight", divider: "fadeUp", realizzazione: "zoomSoft",
        stat: "fadeUp", quote: "fadeUp", tip: "fadeUp", "video-moment": "fadeIn", bumper: "fadeUp",
      };

      // Pannello di diagnostica: si attiva aprendo la pagina con ?debug=1 e
      // mostra gli ultimi eventi audio/video e lo stato aggiornato ogni secondo
      // (utile per capire cosa fa una TV senza console).
      const DEBUG = new URLSearchParams(location.search).has("debug");
      const dbgLines = [];
      let dbgStatus = "";
      function renderDbg() {
        const el = document.getElementById("dbg");
        el.hidden = false;
        el.textContent = dbgLines.join("\n") + (dbgStatus ? "\n— " + dbgStatus : "");
      }
      // Gli eventi vengono sempre mandati al server (vedi "Diagnostica TV" nella
      // pagina admin), così non serve fotografare lo schermo della TV.
      const diagSid = Math.random().toString(36).slice(2, 10);
      const diagBuf = [];
      let diagSent = 0;
      function flushDiag() {
        if (!diagBuf.length) return;
        const lines = diagBuf.splice(0, 50);
        diagSent += lines.length;
        try {
          fetch("/api/showroom/diag", {
            method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify({ sid: diagSid, ua: navigator.userAgent, lines }),
          }).catch(() => {});
        } catch (_) {}
      }
      setInterval(flushDiag, 5000);
      window.addEventListener("error", (e) => dbg(`ERRORE JS: ${e.message} @${(e.filename || "").slice(-24)}:${e.lineno}`));
      function dbg(msg) {
        const line = `${new Date().toLocaleTimeString("it-IT")} ${msg}`;
        if (diagSent + diagBuf.length < 500) diagBuf.push(line);
        if (!DEBUG) return;
        dbgLines.push(line);
        if (dbgLines.length > 16) dbgLines.shift();
        renderDbg();
      }
      function bindMediaDebug(el, label) {
        ["loadedmetadata", "canplay", "playing", "pause", "waiting", "stalled", "ended", "error", "emptied"].forEach((ev) => {
          el.addEventListener(ev, () => {
            const extra = ev === "loadedmetadata" ? ` ${el.videoWidth || ""}x${el.videoHeight || ""} ${Math.round(el.duration)}s`
              : ev === "error" ? ` code=${el.error && el.error.code} ${el.error && el.error.message || ""}` : "";
            dbg(`${label} ${ev}${extra}`);
          });
        });
      }

      // ---- video di intermezzo: un solo <video> persistente per tutta la vita
      // della pagina (vedi commento nel CSS), riusato cambiando src.
      const tvVideo = document.getElementById("tvVideo");
      const tvCopy = document.getElementById("tvVideoCopy");
      let videoSlideActive = false;
      // La TV ha un solo canale media: far partire il video mette in pausa la
      // musica e viceversa. Finché un video è in onda (e nei 700ms di
      // smontaggio) la musica resta in pausa e nessuno la riavvia a forza,
      // altrimenti i due si mettono in pausa a vicenda e il video va a scatti.
      let videoHoldsMedia = false;
      let videoToken = 0;
      let videoWatchdog = null;
      let tvStuck = 0;
      let tvLastT = -1;
      let diagTick = 0;
      let rvfcLast = null, rvfcPrev = null;
      if (tvVideo.requestVideoFrameCallback) {
        const rvfcLoop = (now, meta) => { rvfcLast = { now, frames: meta.presentedFrames }; tvVideo.requestVideoFrameCallback(rvfcLoop); };
        tvVideo.requestVideoFrameCallback(rvfcLoop);
      }
      bindMediaDebug(tvVideo, "video");
      // Il video si mostra solo quando sta davvero girando: mai un riquadro
      // nero o a metà in attesa del primo frame.
      tvVideo.addEventListener("playing", () => {
        if (!videoSlideActive) return;
        tvVideo.classList.add("on");
        if (tvCopy.innerHTML) tvCopy.classList.add("on");
      });
      // Niente loop (il riavvolgimento blocca molti player TV): a fine clip si
      // passa alla slide successiva.
      tvVideo.addEventListener("ended", () => { if (videoSlideActive && playing) advance(); });
      tvVideo.addEventListener("error", () => { if (videoSlideActive && playing) advance(); });

      function hideTvVideo() {
        videoSlideActive = false;
        clearTimeout(videoWatchdog);
        document.body.classList.remove("video-slide");
        tvVideo.classList.remove("on");
        tvCopy.classList.remove("on");
        const token = ++videoToken;
        const wasHolding = videoHoldsMedia;
        // Liberato il decoder solo dopo la dissolvenza (e solo se nel frattempo
        // non è partito un altro video); poi la musica riparte da dove era.
        setTimeout(() => {
          if (token !== videoToken) return;
          try { tvVideo.pause(); tvVideo.removeAttribute("src"); tvVideo.load(); } catch (_) {}
          videoHoldsMedia = false;
          if (wasHolding && audioStarted && musicPaused()) {
            dbg("video finito: riprendo la musica");
            Promise.resolve(musicPlay()).catch((e) => dbg(`audio.play() rifiutato: ${e && e.name}`));
          }
        }, 700);
      }

      function startTvVideo(v) {
        videoSlideActive = true;
        videoToken++;
        videoHoldsMedia = true;
        if (!webMusic) { try { audioEl.pause(); } catch (_) {} }
        tvStuck = 0;
        tvLastT = -1;
        document.body.classList.add("video-slide");
        tvCopy.innerHTML = v.title ? `<span class="video-pill">Dal nostro mondo</span><p class="video-title">${v.title}</p>` : "";
        // L'attributo muted da solo non basta su tutti i motori: la proprietà
        // JS va forzata perché l'autoplay senza gesto utente funzioni.
        tvVideo.muted = true;
        tvVideo.defaultMuted = true;
        tvVideo.loop = false;
        tvVideo.src = v.attachment.url;
        tvVideo.load();
        // Si parte solo con abbastanza dati in buffer (canplaythrough) per non
        // andare a scatti aspettando la rete; se l'evento non arriva si parte
        // comunque dopo 2,5 s. play() mai prima che il layer sia visibile.
        const myToken = videoToken;
        let kicked = false;
        const kick = () => {
          if (kicked || !videoSlideActive || myToken !== videoToken) return;
          kicked = true;
          tvVideo.play().catch((e) => dbg(`video.play() rifiutato: ${e && e.name}`));
        };
        tvVideo.addEventListener("canplaythrough", () => requestAnimationFrame(kick), { once: true });
        setTimeout(() => requestAnimationFrame(kick), 2500);
        clearTimeout(videoWatchdog);
        videoWatchdog = setTimeout(() => {
          if (playing && videoSlideActive && !tvVideo.classList.contains("on")) {
            dbg("video non partito entro 7s: salto la slide");
            advance();
          }
        }, 7000);
      }

      // Controllo ogni secondo: video fermo (frame congelato) → prima si
      // prova a riprendere, poi si salta la slide; in debug aggiorna anche lo
      // stato mostrato a schermo.
      setInterval(() => {
        if (videoSlideActive && playing && tvVideo.classList.contains("on") && !tvVideo.ended) {
          const t = tvVideo.currentTime;
          tvStuck = t === tvLastT ? tvStuck + 1 : 0;
          tvLastT = t;
          if (tvStuck === 2) { dbg("video fermo: provo a riprendere"); tvVideo.play().catch(() => {}); }
          if (tvStuck >= 4) { dbg("video bloccato: salto la slide"); advance(); }
        }
        diagTick++;
        if (videoSlideActive && diagTick % 2 === 0) {
          const q = tvVideo.getVideoPlaybackQuality ? tvVideo.getVideoPlaybackQuality() : null;
          let fps = "?";
          if (rvfcLast && rvfcPrev && rvfcLast.now > rvfcPrev.now) fps = ((rvfcLast.frames - rvfcPrev.frames) * 1000 / (rvfcLast.now - rvfcPrev.now)).toFixed(0);
          rvfcPrev = rvfcLast;
          const buf = tvVideo.buffered.length ? tvVideo.buffered.end(tvVideo.buffered.length - 1).toFixed(1) : "0";
          dbg(`video t=${tvVideo.currentTime.toFixed(1)} rs=${tvVideo.readyState} buf=${buf} ${tvVideo.paused ? "PAUSA" : "play"} fps=${fps} frame=${q ? q.totalVideoFrames : "?"} persi=${q ? q.droppedVideoFrames : "?"} | musica ${musicPaused() ? "PAUSA" : "ok"} ${Math.round(musicClock())}s`);
        }
        if (diagTick % 15 === 0) dbg(`audio ${musicPaused() ? "PAUSA" : "ok"} t=${Math.round(musicClock())} vol=${musicVolume}${musicMuted ? " MUTO" : ""}${webMusic ? " (WebAudio)" : ""}`);
        if (DEBUG) {
          const a = `audio ${musicPaused() ? "PAUSA" : "ok"} ${Math.round(musicClock())}s vol=${musicVolume}${musicMuted ? " MUTO" : ""}${webMusic ? " WA" : ""}`;
          const v = videoSlideActive ? `video t=${tvVideo.currentTime.toFixed(1)} rs=${tvVideo.readyState} ns=${tvVideo.networkState} ${tvVideo.paused ? "pausa" : "play"}` : "video -";
          dbgStatus = `${a} | ${v}`;
          renderDbg();
        }
      }, 1000);

      function showSlide(item) {
        const rendered = renderSlide(item);
        const nextIdx = (activeLayerIdx + 1) % 2;
        const nextEl = layerEls[nextIdx];
        const inner = nextEl.querySelector(".slide-inner");
        hideTvVideo();
        inner.innerHTML = rendered.html;
        dbg(`slide ${seqPos + 1}/${sequence.length} ${rendered.kind}`);
        if (rendered.kind === "stat") animateStatCountUp(inner);
        if (rendered.kind === "product") renderQrCode(inner);

        const img = inner.querySelector("img");
        if (img) img.addEventListener("error", () => { if (playing) advance(); }, { once: true });

        const anim = ENTER_BY_KIND[rendered.kind] || "fadeUp";
        inner.style.animation = "none";
        void inner.offsetWidth;
        inner.style.animation = `${anim} .85s cubic-bezier(.22,.85,.3,1) both`;

        layerEls[activeLayerIdx].classList.remove("active");
        nextEl.classList.add("active");
        activeLayerIdx = nextIdx;
        document.body.classList.toggle("on-dark", rendered.dark);

        let duration = DURATIONS[rendered.kind] || 7000;
        if (rendered.kind === "video-moment") {
          startTvVideo(item.data);
          // Durata reale del clip se nota (salvata dalla pagina admin); a fine
          // clip comunque scatta 'ended'. Il timer è solo un paracadute.
          const sec = Number(item.data.durationSec) || 0;
          duration = sec > 0 ? Math.min(18000, Math.max(4000, sec * 1000 + 1500)) : 16000;
          document.body.classList.add("video-slide");
        }
        runProgress(duration);
        document.getElementById("hud-count").textContent = `${seqPos + 1}/${sequence.length}`;
        return duration;
      }

      function runProgress(duration) {
        const bar = document.getElementById("progress");
        bar.style.transition = "none";
        bar.style.width = "0";
        void bar.offsetWidth;
        bar.style.transition = `width ${duration}ms linear`;
        bar.style.width = "100%";
      }

      function scheduleNext(duration) {
        clearTimeout(advanceTimer);
        if (!playing) return;
        advanceTimer = setTimeout(advance, duration);
      }

      function advance() {
        seqPos = (seqPos + 1) % sequence.length;
        if (seqPos === 0) sequence = buildSequence(data);
        const duration = showSlide(sequence[seqPos]);
        scheduleNext(duration);
      }

      function prev() {
        seqPos = (seqPos - 2 + sequence.length) % sequence.length;
        advance();
      }

      function togglePlay(force) {
        playing = typeof force === "boolean" ? force : !playing;
        document.getElementById("btn-play").innerHTML = playing ? "&#10074;&#10074;" : "&#9658;";
        const bar = document.getElementById("progress");
        if (playing) {
          scheduleNext(4000);
        } else {
          clearTimeout(advanceTimer);
          const cs = getComputedStyle(bar);
          bar.style.width = cs.width;
          bar.style.transition = "none";
        }
      }

      /* ---------- audio: playlist handpan in loop, locale (no stream esterno) ---------- */
      // La TV ha un solo "lettore" multimediale: un <audio> e un <video> insieme
      // si mettono in pausa a vicenda. Per questo la musica passa, quando
      // possibile, dal motore audio del browser (Web Audio), che decodifica gli
      // mp3 via software e non usa il lettore della TV: così può suonare mentre
      // gira un video. Se Web Audio manca o fallisce si ricade sull'elemento
      // <audio> (con la pausa durante i video). ?music=element lo forza.
      const audioEl = document.getElementById("audio");
      const FORCE_ELEMENT = new URLSearchParams(location.search).get("music") === "element";
      let webMusic = null;
      let musicVolume = 0.5;
      let musicMuted = false;
      let stationIdx = Number(localStorage.getItem("showroom-station-idx")) || 0;

      // Indice dei frame di un mp3 (MPEG Layer III): serve a decodificare la
      // traccia a blocchi di ~15 s invece di tenerne in memoria i 4-14 minuti
      // di PCM (centinaia di MB, troppi per una TV).
      function indexMp3(b) {
        let i = 0;
        if (b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) i = 10 + (((b[6] & 0x7f) << 21) | ((b[7] & 0x7f) << 14) | ((b[8] & 0x7f) << 7) | (b[9] & 0x7f));
        const BR1 = [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320];
        const BR2 = [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160];
        const SR = { 3: [44100, 48000, 32000], 2: [22050, 24000, 16000], 0: [11025, 12000, 8000] };
        const frames = [];
        let sampleRate = 0, spf = 1152;
        while (i + 4 <= b.length) {
          if (b[i] !== 0xff || (b[i + 1] & 0xe0) !== 0xe0) { i++; continue; }
          const ver = (b[i + 1] >> 3) & 3, layer = (b[i + 1] >> 1) & 3, bri = b[i + 2] >> 4, sri = (b[i + 2] >> 2) & 3, pad = (b[i + 2] >> 1) & 1;
          if (ver === 1 || layer !== 1 || bri === 0 || bri === 15 || sri === 3) { i++; continue; }
          const rate = SR[ver][sri];
          const len = Math.floor((ver === 3 ? 144 : 72) * (ver === 3 ? BR1 : BR2)[bri] * 1000 / rate) + pad;
          if (i + len > b.length) break;
          const nx = i + len;
          const nextOk = nx + 4 > b.length || (b[nx] === 0xff && (b[nx + 1] & 0xe0) === 0xe0) || (b[nx] === 0x54 && b[nx + 1] === 0x41 && b[nx + 2] === 0x47);
          if (!nextOk) { i++; continue; }
          sampleRate = rate;
          spf = ver === 3 ? 1152 : 576;
          frames.push({ offset: i, length: len });
          i = nx;
        }
        return { frames, sampleRate, spf };
      }

      class WebMusic {
        constructor(AC) {
          this.ctx = new AC();
          this.gain = this.ctx.createGain();
          this.gain.connect(this.ctx.destination);
          this.volume = 0.5;
          this.muted = false;
          this.token = 0;
          this.sources = [];
          this.timer = null;
          this.pumpingFor = null;
          this.track = null;
          this.onEnded = null;
          this.onError = null;
          this.ctx.onstatechange = () => dbg(`audioctx ${this.ctx.state}`);
        }
        applyGain() { this.gain.gain.value = this.muted ? 0 : this.volume; }
        setVolume(v) { this.volume = v; this.applyGain(); }
        setMuted(m) { this.muted = m; this.applyGain(); }
        paused() { return this.ctx.state !== "running"; }
        pause() { return this.ctx.suspend(); }
        resume() { return this.ctx.resume(); }
        elapsed() { return this.track ? Math.max(0, this.ctx.currentTime - this.track.t0) : 0; }
        stop() {
          this.token++;
          clearInterval(this.timer);
          this.sources.forEach((s) => { try { s.stop(); } catch (_) {} });
          this.sources = [];
          this.track = null;
        }
        destroy() { this.stop(); try { this.ctx.close(); } catch (_) {} }
        async playTrack(url) {
          this.stop();
          const token = this.token;
          // resume() va chiamato subito, dentro il gesto dell'utente (autoplay)
          this.ctx.resume().catch(() => {});
          const res = await fetch(url);
          if (!res.ok) throw new Error(`fetch ${res.status}`);
          const bytes = new Uint8Array(await res.arrayBuffer());
          if (token !== this.token) return;
          const info = indexMp3(bytes);
          if (!info.frames.length) throw new Error("mp3 non riconosciuto");
          const t0 = this.ctx.currentTime + 0.2;
          this.track = { bytes, ...info, next: 0, t0, playAt: t0 };
          dbg(`musica webaudio: ${info.frames.length} frame ${info.sampleRate}Hz, ctx ${this.ctx.sampleRate}Hz`);
          await this.pump(token);
          if (token !== this.token) return;
          this.timer = setInterval(() => this.pump(token).catch((e) => this.onError && this.onError(e)), 1000);
        }
        async pump(token) {
          if (this.pumpingFor === token) return;
          this.pumpingFor = token;
          try {
            const t = this.track;
            while (token === this.token && t.next < t.frames.length && t.playAt - this.ctx.currentTime < 30) {
              await this.decodeNext(token);
            }
            if (token === this.token && t.next >= t.frames.length && t.playAt - this.ctx.currentTime <= 0.05 && this.ctx.state === "running") {
              this.stop();
              if (this.onEnded) this.onEnded();
            }
          } finally {
            if (this.pumpingFor === token) this.pumpingFor = null;
          }
        }
        async decodeNext(token) {
          const t = this.track;
          const chunk = Math.round(15 * t.sampleRate / t.spf);
          // qualche frame prima e dopo il blocco servono solo a "scaldare" il
          // decoder e il ricampionatore: vengono scartati, così i blocchi
          // consecutivi si saldano senza click.
          const lead = Math.min(3, t.next);
          const b = Math.min(t.frames.length, t.next + chunk);
          const tail = Math.min(2, t.frames.length - b);
          const first = t.frames[t.next - lead], last = t.frames[b + tail - 1];
          const buf = await this.ctx.decodeAudioData(t.bytes.slice(first.offset, last.offset + last.length).buffer);
          if (token !== this.token) return;
          const leadSec = lead * t.spf / t.sampleRate;
          const bodySec = (b - t.next) * t.spf / t.sampleRate;
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          src.connect(this.gain);
          const when = Math.max(t.playAt, this.ctx.currentTime + 0.05);
          src.start(when, leadSec, bodySec);
          src.onended = () => { this.sources = this.sources.filter((x) => x !== src); };
          this.sources.push(src);
          t.playAt = when + bodySec;
          t.next = b;
        }
      }

      function musicPaused() { return webMusic ? webMusic.paused() : audioEl.paused; }
      function musicPlay() { return webMusic ? webMusic.resume() : audioEl.play(); }
      function musicClock() { return webMusic ? webMusic.elapsed() : audioEl.currentTime; }
      function setMusicVolume(v) { musicVolume = v; audioEl.volume = v; if (webMusic) webMusic.setVolume(v); }
      function setMusicMuted(m) { musicMuted = m; audioEl.muted = m; if (webMusic) webMusic.setMuted(m); }

      function fallbackToElementMusic(reason) {
        dbg(`Web Audio non riuscito (${reason}): uso <audio>`);
        if (webMusic) { try { webMusic.destroy(); } catch (_) {} webMusic = null; }
        audioEl.volume = musicVolume;
        audioEl.muted = musicMuted;
        loadStation(stationIdx, true);
      }

      function loadStation(idx, autoplay) {
        stationIdx = ((idx % TRACKS.length) + TRACKS.length) % TRACKS.length;
        localStorage.setItem("showroom-station-idx", String(stationIdx));
        document.getElementById("station").value = String(stationIdx);
        if (webMusic) {
          webMusic.playTrack(TRACKS[stationIdx].url).catch((e) => fallbackToElementMusic(e && e.message || e));
          return;
        }
        audioEl.src = TRACKS[stationIdx].url;
        if (autoplay) audioEl.play().catch(() => {});
      }
      // Ogni traccia dura 4-14 minuti, non è uno stream infinito: alla fine
      // passa alla successiva (torna alla prima dopo l'ultima). Il retry su
      // errore resta, nel caso un file singolo non si carichi.
      audioEl.addEventListener("ended", () => loadStation(stationIdx + 1, true));
      bindMediaDebug(audioEl, "audio");
      // Le smart TV possono sospendere l'audio: finché la vetrina è avviata, se
      // la musica risulta in pausa senza motivo la si riprende (mai mentre un
      // video tiene il canale media: i due si metterebbero in pausa a vicenda).
      let audioStarted = false;
      setInterval(() => {
        if (audioStarted && musicPaused() && !audioEl.error && !videoHoldsMedia) {
          dbg("audio in pausa: riprendo");
          Promise.resolve(musicPlay()).catch((e) => dbg(`audio.play() rifiutato: ${e && e.name}`));
        }
      }, 4000);
      let stationRetryTimer = null;
      audioEl.addEventListener("error", () => {
        clearTimeout(stationRetryTimer);
        stationRetryTimer = setTimeout(() => loadStation(stationIdx + 1, true), 8000);
      });

      async function requestWakeLock() {
        try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && !wakeLock) requestWakeLock();
        if (document.visibilityState === "visible" && videoSlideActive && tvVideo.paused && !tvVideo.ended) tvVideo.play().catch(() => {});
      });

      function tickClock() {
        const d = new Date();
        document.getElementById("clock").textContent = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      }
      setInterval(tickClock, 15000);

      let hudTimer = null;
      function flashHud() {
        const hud = document.getElementById("hud");
        hud.classList.add("visible");
        document.body.classList.add("show-cursor");
        clearTimeout(hudTimer);
        hudTimer = setTimeout(() => {
          hud.classList.remove("visible");
          document.body.classList.remove("show-cursor");
        }, 4500);
      }
      ["mousemove", "keydown", "pointerdown"].forEach((ev) => window.addEventListener(ev, flashHud));

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") advance();
        else if (e.key === "ArrowLeft") prev();
        else if (e.key === " " || e.key === "Enter") togglePlay();
        else if (e.key === "m" || e.key === "M") toggleMute();
      });

      function toggleMute() {
        setMusicMuted(!musicMuted);
        document.getElementById("btn-mute").innerHTML = musicMuted ? "&#128263;" : "&#128266;";
      }

      function wireHud() {
        document.getElementById("btn-next").addEventListener("click", advance);
        document.getElementById("btn-prev").addEventListener("click", prev);
        document.getElementById("btn-play").addEventListener("click", () => togglePlay());
        document.getElementById("btn-mute").addEventListener("click", toggleMute);

        const select = document.getElementById("station");
        TRACKS.forEach((s, i) => {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = s.name;
          select.appendChild(opt);
        });
        select.value = String(stationIdx);
        select.addEventListener("change", () => loadStation(Number(select.value), true));

        const vol = document.getElementById("vol");
        const savedVol = localStorage.getItem("showroom-volume");
        setMusicVolume(savedVol !== null ? Number(savedVol) : 0.5);
        vol.value = String(musicVolume);
        vol.addEventListener("input", () => {
          setMusicVolume(Number(vol.value));
          localStorage.setItem("showroom-volume", vol.value);
        });

        // Il muto non si ricorda tra una sessione e l'altra: su una TV senza
        // tastiera un tocco accidentale lo renderebbe permanente.
        localStorage.removeItem("showroom-muted");
        setMusicMuted(false);
        document.getElementById("btn-mute").innerHTML = "&#128266;";
      }

      function start() {
        document.getElementById("start-overlay").classList.add("hidden");
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) { try { Promise.resolve(req.call(el)).catch(() => {}); } catch (_) {} }
        requestWakeLock();
        audioStarted = true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !FORCE_ELEMENT) {
          try {
            webMusic = new WebMusic(AC);
            webMusic.setVolume(musicVolume);
            webMusic.setMuted(musicMuted);
            webMusic.onEnded = () => loadStation(stationIdx + 1, true);
            webMusic.onError = (e) => fallbackToElementMusic(e && e.message || e);
          } catch (e) {
            webMusic = null;
            dbg(`Web Audio non disponibile: ${e && e.message}`);
          }
        }
        dbg(`musica: ${webMusic ? "Web Audio" : "elemento <audio>"}`);
        loadStation(stationIdx, true);
        // Se il contesto audio non parte (autoplay bloccato, TV che non lo
        // supporta davvero) si torna al vecchio <audio> invece di restare muti.
        if (webMusic) {
          setTimeout(() => {
            if (!webMusic || !webMusic.paused() || videoHoldsMedia) return;
            webMusic.resume().catch(() => {});
            setTimeout(() => {
              if (webMusic && webMusic.paused() && !videoHoldsMedia) fallbackToElementMusic("contesto audio non partito");
            }, 3000);
          }, 3000);
        }
        {
          const probe = (t) => (document.createElement(t.startsWith("audio") ? "audio" : "video").canPlayType(t) || "no");
          dbg(`schermo ${innerWidth}x${innerHeight} dpr=${window.devicePixelRatio} cpu=${navigator.hardwareConcurrency || "?"} ram=${navigator.deviceMemory || "?"}GB`);
          dbg(`h264base ${probe('video/mp4; codecs="avc1.42E01E"')}, h264high ${probe('video/mp4; codecs="avc1.640028"')}, hevc ${probe('video/mp4; codecs="hvc1.1.6.L93.B0"')}, mp3 ${probe("audio/mpeg")}, rVFC ${tvVideo.requestVideoFrameCallback ? "si" : "no"}`);
        }
        tickClock();
        advance();
        flashHud();
      }

      // Realizzazioni e video di intermezzo vivono nella stessa collezione
      // lato server (store.showroomPhotos) — una sola fetch, poi si separano
      // per categoria/mediaType invece di interrogare due volte lo stesso
      // endpoint.
      async function fetchShowroomPhotoItems() {
        try {
          const res = await fetch("/api/showroom/photos", { cache: "no-store" });
          const json = await res.json();
          return json.items || [];
        } catch (_) {
          return [];
        }
      }

      const prefetchedVideos = new Set();
      async function refreshShowroomPhotos() {
        const items = await fetchShowroomPhotoItems();
        const realizzazioni = items.filter((item) => item.category === "realizzazioni" && item.attachment?.url);
        // Solo i video convertiti per la TV dalla pagina admin (tvReady): gli
        // originali dei telefoni escono ruotati o a metà schermo sulle smart TV.
        // ?allvideos=1 li include comunque (per prove).
        const allowRaw = new URLSearchParams(location.search).has("allvideos");
        const videoMoments = items.filter((item) => item.category === "intermezzo" && item.mediaType === "video"
          && item.attachment?.url && (item.tvReady || allowRaw));
        // Se la fetch fallisce o torna vuota si tiene quello che c'era prima
        // invece di svuotare la vetrina — stesso criterio già in uso altrove.
        if (realizzazioni.length) data.realizzazioni = realizzazioni;
        // I clip sono piccoli (1-4 MB): scaricarli in anticipo nella cache del
        // browser toglie la rete dall'equazione quando la TV li riproduce.
        videoMoments.forEach((v) => {
          if (prefetchedVideos.has(v.attachment.url)) return;
          prefetchedVideos.add(v.attachment.url);
          fetch(v.attachment.url, { cache: "force-cache" }).then((r) => r.blob()).catch(() => {});
        });
        if (videoMoments.length) data.videoMoments = videoMoments;
      }

      async function fetchProductPhotos() {
        try {
          const res = await fetch("/api/showroom/product-photos", { cache: "no-store" });
          const json = await res.json();
          const map = {};
          (json.items || []).forEach((item) => {
            if (item.attachment?.url) map[item.productId] = item.attachment.url;
          });
          return map;
        } catch (_) {
          return {};
        }
      }

      async function init() {
        wireHud();
        try {
          const [manifest, collections, settings] = await Promise.all([
            fetch("/showroom-content/manifest.json", { cache: "no-store" }).then((r) => r.json()),
            fetch("/showroom-content/catalog.json", { cache: "no-store" }).then((r) => r.json()),
            fetch("/api/showroom/settings", { cache: "no-store" }).then((r) => r.json()).catch(() => ({ activeCollections: null })),
          ]);
          data.brand = manifest.brand || {};
          data.coolStuff = manifest.coolStuff || [];
          data.collections = collections;
          data.activeCollectionIds = settings.activeCollections || null;
        } catch (_) {
          data = { brand: { name: "Prato Sintetico Italia", tagline: "", logo: "/showroom-content/logo.png" }, coolStuff: [], collections: [], activeCollectionIds: null, realizzazioni: [], productPhotos: {}, videoMoments: [] };
        }
        await refreshShowroomPhotos();
        data.productPhotos = await fetchProductPhotos();
        sequence = buildSequence(data);
        document.getElementById("btn-start").addEventListener("click", start, { once: true });
        setInterval(async () => {
          await refreshShowroomPhotos();
          data.productPhotos = await fetchProductPhotos();
        }, 5 * 60 * 1000);
      }
      init();
    </script>
  </body>
</html>
