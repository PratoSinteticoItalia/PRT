<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PSI Ops" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Garden Planner</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #f3f6f4;
      }

      #garden-print-sheet {
        display: none;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 8mm;
        }

        html, body {
          background: #ffffff;
          margin: 0;
          padding: 0;
        }

        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        body.garden-print-report #app {
          display: none !important;
        }

        body.garden-print-report #garden-print-sheet {
          display: block !important;
          width: 100% !important;
          max-width: 194mm;
          padding: 0 !important;
          margin: 0 !important;
          background: #fff !important;
        }

        body.garden-print-report #garden-print-sheet .print-sheet-root {
          width: 100%;
          margin: 0 auto;
          box-sizing: border-box;
        }

        body.garden-print-report #garden-print-sheet .print-no-break {
          break-inside: avoid-page;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="garden-print-sheet" aria-hidden="true" data-no-i18n></div>
    <noscript>Abilita JavaScript per usare il Garden Planner.</noscript>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Bundle già compilato da esbuild (garden-planner-page.min.js): script classico, niente Babel a runtime -->
    <script src="./garden-planner-page.js?v=20261024-generatore-leggibile"></script>
    <script type="module">
      // Interfaccia in inglese se scelta nel portale (stesso catalogo dell'app).
      // I report per il cliente hanno data-no-i18n e restano in italiano.
      import { translateItToEn } from "./lib/i18n-en.js?v=20261024-generatore-leggibile";
      import { createDomTranslator } from "./lib/i18n-dom.js?v=20261024-generatore-leggibile";
      const translator = createDomTranslator(translateItToEn);
      const readLang = () => { try { return window.localStorage.getItem("psi-lang") === "en" ? "en" : "it"; } catch { return "it"; } };
      const applyLang = () => {
        const lang = readLang();
        document.documentElement.lang = lang;
        if (lang === "en") translator.start(document.body);
        else translator.stop();
      };
      applyLang();
      window.addEventListener("storage", (event) => { if (event.key === "psi-lang") applyLang(); });
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // Register without update logic — the main app SW handles version updates.
          // Avoid registration.waiting checks and controllerchange reloads here to
          // prevent the garden planner iframe from reloading every time it opens.
          navigator.serviceWorker.register("./sw.js?v=20261024-generatore-leggibile").catch(() => {});
        });
      }
    </script>
  </body>
</html>
