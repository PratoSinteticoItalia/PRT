<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vetrina — Prato Sintetico Italia</title>
    <link rel="icon" href="/logo-prato.png" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    />
    <style>
      :root {
        --brand: #2d6a4f;
        --brand-dark: #1b4332;
        --brand-soft: #d8f3dc;
        --brand-xsoft: #f1f8f3;
        --ink: #16241c;
        --muted: #64766c;
        --line: #e3ece5;
        --paper: #ffffff;
        --amber: #d97706;
        --amber-soft: #fef3c7;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; background: var(--paper);
        overflow: hidden; font-family: "DM Sans", sans-serif; cursor: none;
      }
      body.show-cursor { cursor: default; }
      .num { font-variant-numeric: tabular-nums; }

      #stage { position: fixed; inset: 0; background: var(--paper); }
      .layer { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .5s ease; }
      .layer.active { opacity: 1; z-index: 2; }
      .slide-inner { position: absolute; inset: 0; }

      /* ---------- template: divisore categoria ---------- */
      .tpl-divider {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--brand); color: #fff; text-align: center; gap: .6rem;
      }
      .tpl-divider .eyebrow { font: 700 .85rem "DM Sans"; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
      .tpl-divider .cat-name { font: 800 clamp(2.2rem, 5vw, 4rem)/1.05 "DM Sans"; letter-spacing: -.01em; }
      .tpl-divider .cat-count { font: 500 1.1rem "DM Sans"; opacity: .85; }

      /* ---------- template: prodotto ---------- */
      .tpl-product { position: absolute; inset: 0; display: flex; background: var(--paper); }
      .product-immersive { position: relative; flex: 1 1 60%; overflow: hidden; background: #0c130f; }
      .product-immersive img {
        position: absolute; top: 50%; left: 50%; width: 118%; height: 118%; object-fit: cover;
        object-position: center; animation: kenBurnsSlow 9.5s ease-out both;
      }
      .product-immersive .fade-edge {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, var(--paper) 0%, rgba(255,255,255,0) 14%, rgba(0,0,0,0) 70%, rgba(0,0,0,.18) 100%);
      }
      .product-panel {
        position: relative; z-index: 2; flex: 0 0 40%; max-width: 40%;
        display: flex; flex-direction: column; justify-content: center; gap: 1.1rem;
        padding: 5vh 3.6vw 5vh 4.4vw; background: var(--paper);
      }
      .swatch-frame {
        width: clamp(120px, 13vw, 180px); aspect-ratio: 1; border-radius: 14px; overflow: hidden;
        border: 1px solid var(--line); box-shadow: 0 18px 30px rgba(22,36,28,.14); background: #fff;
      }
      .swatch-frame img { width: 100%; height: 100%; object-fit: cover; }
      .index-label { font: 600 .78rem "DM Sans"; letter-spacing: .1em; color: var(--muted); }
      .cat-pill {
        display: inline-flex; align-self: flex-start; align-items: center; gap: .5em;
        color: var(--brand); font: 700 .74rem "DM Sans"; letter-spacing: .14em; text-transform: uppercase;
      }
      .cat-pill::before { content: ""; width: 1.3em; height: 1.5px; background: var(--brand); display: inline-block; }
      .product-name {
        font: 500 clamp(2rem, 3vw, 2.7rem)/1.08 "Fraunces", serif; color: var(--ink); margin: 0; letter-spacing: -.01em;
      }
      .product-desc { font: 400 1.05rem/1.5 "DM Sans"; color: var(--muted); max-width: 32ch; margin: 0; }
      .product-price { display: flex; align-items: baseline; gap: .4em; }
      .product-price .amount { font: 700 clamp(2rem, 3.4vw, 2.8rem)/1 "DM Sans"; color: var(--brand); }
      .product-price .unit { font: 600 .9rem "DM Sans"; color: var(--muted); }
      .spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
      .spec-item { display: flex; flex-direction: column; gap: .2rem; }
      .spec-item .k { font: 700 .64rem "DM Sans"; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
      .spec-item .v { font: 600 .95rem "DM Sans"; color: var(--ink); }

      @keyframes slideInRight { from { opacity: 0; transform: translateX(6%); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideOutLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-6%); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(2.5%); } to { opacity: 1; transform: translateY(0); } }
      @keyframes zoomSoft { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
      @keyframes kenBurnsSlow { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.14); } }

      /* ---------- template: realizzazione (sobria) ---------- */
      .tpl-realizzazione { position: absolute; inset: 0; overflow: hidden; background: #0c130f; }
      .tpl-realizzazione img { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; }
      .tpl-realizzazione .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(10,20,14,.72) 0%, rgba(10,20,14,.15) 32%, transparent 55%);
      }
      .tpl-realizzazione .copy { position: absolute; left: 4.5%; bottom: 6%; right: 4.5%; color: #fff; display: flex; align-items: center; gap: .9rem; }
      .real-pill {
        display: inline-flex; align-items: center; padding: .38em 1em; border-radius: 999px;
        background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(6px);
        font: 700 .72rem "DM Sans"; letter-spacing: .08em; text-transform: uppercase;
      }
      .real-title { font: 600 1.4rem "DM Sans"; margin: 0; }

      /* ---------- template: stat / quote (chiaro, coerente) ---------- */
      .tpl-stat {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--brand-xsoft); color: var(--brand-dark); text-align: center; gap: .3rem;
      }
      .tpl-stat .num { font: 800 clamp(4.5rem, 10vw, 8rem)/1 "DM Sans"; }
      .tpl-stat .lbl { font: 600 clamp(1rem, 1.6vw, 1.4rem)/1.3 "DM Sans"; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

      .tpl-quote {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: var(--brand); color: #fff; padding: 0 10%; text-align: center;
      }
      .tpl-quote blockquote { margin: 0; font: 600 clamp(1.6rem, 3.2vw, 2.6rem)/1.35 "DM Sans"; }

      /* ---------- template: bumper (logo) ---------- */
      .tpl-bumper {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--paper); color: var(--brand-dark); text-align: center; gap: 1.2rem;
      }
      .tpl-bumper img { width: clamp(110px, 13vw, 180px); }
      .tpl-bumper .tagline { font: 600 clamp(1.1rem, 2vw, 1.6rem)/1.3 "DM Sans"; color: var(--muted); max-width: 22ch; }

      /* ---------- barra di progresso ---------- */
      #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--brand); z-index: 40; }

      /* ---------- orologio ---------- */
      #clock {
        position: fixed; top: 22px; right: 28px; z-index: 45; color: var(--muted);
        font: 600 1rem/1 "DM Sans"; letter-spacing: .04em; mix-blend-mode: normal;
      }
      .tpl-realizzazione ~ #clock, body.on-dark #clock { color: rgba(255,255,255,.7); }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        padding: 1rem 1.8rem; background: linear-gradient(0deg, rgba(10,20,14,.82), transparent);
        color: #fff; transform: translateY(100%); opacity: 0; transition: transform .35s ease, opacity .35s ease;
        pointer-events: none;
      }
      #hud.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
      #hud button {
        background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff;
        width: 44px; height: 44px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
      }
      #hud button:hover { background: rgba(255,255,255,.24); }
      #hud .cluster { display: flex; align-items: center; gap: .7rem; }
      #hud select, #hud input[type="range"] { accent-color: var(--brand-soft); }
      #hud select {
        background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
        border-radius: 8px; padding: .5em .7em; font: 500 .85rem "DM Sans", sans-serif;
      }
      #hud .count { font: 600 .85rem "DM Sans", sans-serif; opacity: .75; min-width: 3.5em; text-align: center; }

      /* ---------- overlay di avvio ---------- */
      #start-overlay {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.6rem; text-align: center; color: var(--brand-dark);
        background: var(--brand-xsoft); cursor: default;
      }
      #start-overlay img { width: clamp(120px, 14vw, 200px); }
      #start-overlay h1 { font: 800 clamp(1.6rem, 3vw, 2.6rem)/1.2 "DM Sans"; margin: 0; }
      #start-overlay p { font: 400 1.05rem "DM Sans"; color: var(--muted); margin: 0; max-width: 40ch; }
      #start-overlay button {
        margin-top: .6rem; padding: .95em 2.4em; border-radius: 999px; border: none; cursor: pointer;
        background: var(--brand); color: #fff; font: 700 1.05rem "DM Sans";
        box-shadow: 0 10px 30px rgba(45,106,79,.28);
      }
      #start-overlay.hidden { display: none; }

      @media (max-width: 900px) {
        .tpl-product { flex-direction: column; }
        .product-immersive { flex: 1 1 42%; }
        .product-panel { flex: 1 1 58%; max-width: 100%; padding: 3vh 6vw; gap: .7rem; }
        .swatch-frame { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="layer" id="layerA"><div class="slide-inner"></div></div>
      <div class="layer" id="layerB"><div class="slide-inner"></div></div>
    </div>
    <div id="progress"></div>
    <div id="clock"></div>

    <div id="hud">
      <div class="cluster">
        <button id="btn-prev" title="Precedente">&#10094;</button>
        <button id="btn-play" title="Pausa/Riprendi">&#10074;&#10074;</button>
        <button id="btn-next" title="Successiva">&#10095;</button>
        <span class="count" id="hud-count">1/1</span>
      </div>
      <div class="cluster">
        <button id="btn-mute" title="Muto">&#128266;</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" style="width:120px" />
        <select id="station"></select>
      </div>
    </div>

    <div id="start-overlay">
      <img src="/showroom-content/logo.png" alt="Prato Sintetico Italia" />
      <h1>Vetrina Prato Sintetico Italia</h1>
      <p>Catalogo prodotti, realizzazioni e musica di sottofondo per lo showroom.</p>
      <button id="btn-start">Avvia la vetrina</button>
    </div>

    <audio id="audio" preload="none" crossorigin="anonymous"></audio>

    <script>
      const STATIONS = [
        { id: "groove", name: "Groove Salad · chill ambient", url: "https://ice1.somafm.com/groovesalad-128-mp3" },
        { id: "drone", name: "Drone Zone · ambient profondo", url: "https://ice1.somafm.com/dronezone-128-mp3" },
        { id: "deepspace", name: "Deep Space One · ambient spazio", url: "https://ice1.somafm.com/deepspaceone-128-mp3" },
      ];
      const DURATIONS = { divider: 3200, product: 7500, realizzazione: 8500, stat: 6000, quote: 6500, bumper: 4500 };
      const CATEGORY_ORDER = ["Residenziale", "Uso intensivo", "Animali domestici", "Terrazzi & Balconi"];

      const layerEls = [document.getElementById("layerA"), document.getElementById("layerB")];
      let activeLayerIdx = 0;
      let sequence = [];
      let seqPos = -1;
      let data = { brand: {}, coolStuff: [], collections: [], activeCollectionIds: null, realizzazioni: [] };
      let playing = true;
      let advanceTimer = null;
      let wakeLock = null;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Solo le collezioni attive (scelte dall'ufficio in Impostazioni, o
      // tutte se non è mai stato configurato) entrano in sequenza. Dentro
      // ogni collezione, gli item restano raggruppati per categoria (ordine
      // fisso, sono dati strutturati) — solo le realizzazioni vengono
      // rimescolate ad ogni giro, senza mai mischiare le due sezioni.
      function buildSequence(d) {
        const seq = [];
        const activeCollections = Array.isArray(d.activeCollectionIds)
          ? d.collections.filter((c) => d.activeCollectionIds.includes(c.id))
          : d.collections;
        activeCollections.forEach((coll) => {
          const byCategory = new Map();
          (coll.items || []).forEach((p) => {
            const key = p.category || "Altro";
            if (!byCategory.has(key)) byCategory.set(key, []);
            byCategory.get(key).push(p);
          });
          const orderedCats = coll.id === "prato-sintetico"
            ? [
                ...CATEGORY_ORDER.filter((c) => byCategory.has(c)),
                ...[...byCategory.keys()].filter((c) => !CATEGORY_ORDER.includes(c)),
              ]
            : [...byCategory.keys()];
          orderedCats.forEach((cat) => {
            const items = byCategory.get(cat);
            seq.push({ kind: "divider", data: { collection: coll.name, name: cat, count: items.length } });
            items.forEach((p) => seq.push({ kind: "product", data: p, collection: coll }));
          });
        });
        // Due elementi "cose fighe" scelti a caso ad ogni giro (non sempre
        // gli stessi due) come cuscinetto tra catalogo e realizzazioni.
        const cool = shuffle(d.coolStuff || []);
        if (cool[0]) seq.push({ kind: cool[0].type, data: cool[0] });
        seq.push({ kind: "bumper", data: d.brand });
        shuffle(d.realizzazioni || []).forEach((r) => seq.push({ kind: "realizzazione", data: r }));
        if (cool[1]) seq.push({ kind: cool[1].type, data: cool[1] });
        if (!seq.length) seq.push({ kind: "bumper", data: d.brand });
        return seq;
      }

      function renderDivider(d) {
        return `<div class="tpl-divider"><div class="eyebrow">${d.collection}</div><div class="cat-name">${d.name}</div><div class="cat-count">${d.count} modell${d.count === 1 ? "o" : "i"}</div></div>`;
      }

      // Foto "reale" a destra: se l'item ha una lifestyle assegnata la usa,
      // altrimenti pesca (in modo stabile, non a caso ad ogni render) una
      // foto dalle realizzazioni caricate — così ogni prodotto è comunque
      // affiancato da un cantiere vero finché non gli si assegna la sua foto.
      function pickLifestyleImage(item, idx) {
        if (item.lifestyle) return item.lifestyle;
        if (!data.realizzazioni.length) return item.image;
        return data.realizzazioni[idx % data.realizzazioni.length].attachment?.url;
      }

      function renderProduct(p, idx) {
        const specs = p.specs || [];
        const num = String(idx + 1).padStart(2, "0");
        const total = sequence.filter((s) => s.kind === "product").length;
        const lifestyle = pickLifestyleImage(p, idx);
        return `
          <div class="tpl-product">
            <div class="product-immersive">
              <img src="${lifestyle}" alt="" />
              <div class="fade-edge"></div>
            </div>
            <div class="product-panel">
              <div class="swatch-frame"><img src="${p.image}" alt="${p.name}" /></div>
              <div class="index-label num">N. ${num} / ${total}</div>
              <span class="cat-pill">${p.category || ""}</span>
              <h2 class="product-name">${p.name}</h2>
              <p class="product-desc">${p.description || ""}</p>
              <div class="product-price"><span class="amount num">€${p.price}</span><span class="unit">${p.priceUnit || ""}</span></div>
              <div class="spec-row">
                ${specs.map((s) => `<div class="spec-item"><span class="k">${s.k}</span><span class="v">${s.v}</span></div>`).join("")}
              </div>
            </div>
          </div>`;
      }

      function renderRealizzazione(r) {
        return `
          <div class="tpl-realizzazione">
            <img src="${r.attachment?.url || r.image}" alt="${r.title || ""}" />
            <div class="scrim"></div>
            <div class="copy">
              <span class="real-pill">Realizzazione</span>
              <p class="real-title">${r.title || ""}</p>
            </div>
          </div>`;
      }

      function renderStat(d) {
        return `<div class="tpl-stat"><div class="num">${d.value}</div><div class="lbl">${d.label}</div></div>`;
      }
      function renderQuote(d) {
        return `<div class="tpl-quote"><blockquote>${d.text}</blockquote></div>`;
      }
      function renderBumper(brand) {
        return `<div class="tpl-bumper"><img src="${brand.logo}" alt="${brand.name || ""}" /><div class="tagline">${brand.tagline || ""}</div></div>`;
      }

      function renderSlide(item) {
        if (item.kind === "divider") return { kind: "divider", html: renderDivider(item.data), dark: true };
        if (item.kind === "product") {
          const productItems = sequence.filter((s) => s.kind === "product");
          return { kind: "product", html: renderProduct(item.data, productItems.indexOf(item)), dark: false };
        }
        if (item.kind === "realizzazione") return { kind: "realizzazione", html: renderRealizzazione(item.data), dark: true };
        if (item.kind === "stat") return { kind: "stat", html: renderStat(item.data), dark: false };
        if (item.kind === "quote") return { kind: "quote", html: renderQuote(item.data), dark: true };
        return { kind: "bumper", html: renderBumper(item.data), dark: false };
      }

      const ENTER_BY_KIND = {
        product: "slideInRight", divider: "fadeUp", realizzazione: "zoomSoft",
        stat: "fadeUp", quote: "fadeUp", bumper: "fadeUp",
      };

      function showSlide(item) {
        const rendered = renderSlide(item);
        const nextIdx = (activeLayerIdx + 1) % 2;
        const nextEl = layerEls[nextIdx];
        const inner = nextEl.querySelector(".slide-inner");
        inner.innerHTML = rendered.html;

        const img = inner.querySelector("img");
        if (img) img.addEventListener("error", () => { if (playing) advance(); }, { once: true });

        const anim = ENTER_BY_KIND[rendered.kind] || "fadeUp";
        inner.style.animation = "none";
        void inner.offsetWidth;
        inner.style.animation = `${anim} .85s cubic-bezier(.22,.85,.3,1) both`;

        layerEls[activeLayerIdx].classList.remove("active");
        nextEl.classList.add("active");
        activeLayerIdx = nextIdx;
        document.body.classList.toggle("on-dark", rendered.dark);

        const duration = DURATIONS[rendered.kind] || 7000;
        runProgress(duration);
        document.getElementById("hud-count").textContent = `${seqPos + 1}/${sequence.length}`;
        return duration;
      }

      function runProgress(duration) {
        const bar = document.getElementById("progress");
        bar.style.transition = "none";
        bar.style.width = "0";
        void bar.offsetWidth;
        bar.style.transition = `width ${duration}ms linear`;
        bar.style.width = "100%";
      }

      function scheduleNext(duration) {
        clearTimeout(advanceTimer);
        if (!playing) return;
        advanceTimer = setTimeout(advance, duration);
      }

      function advance() {
        seqPos = (seqPos + 1) % sequence.length;
        if (seqPos === 0) sequence = buildSequence(data);
        const duration = showSlide(sequence[seqPos]);
        scheduleNext(duration);
      }

      function prev() {
        seqPos = (seqPos - 2 + sequence.length) % sequence.length;
        advance();
      }

      function togglePlay(force) {
        playing = typeof force === "boolean" ? force : !playing;
        document.getElementById("btn-play").innerHTML = playing ? "&#10074;&#10074;" : "&#9658;";
        const bar = document.getElementById("progress");
        if (playing) {
          scheduleNext(4000);
        } else {
          clearTimeout(advanceTimer);
          const cs = getComputedStyle(bar);
          bar.style.width = cs.width;
          bar.style.transition = "none";
        }
      }

      /* ---------- audio: stazioni ambient con fallback automatico ---------- */
      const audioEl = document.getElementById("audio");
      let stationIdx = Number(localStorage.getItem("showroom-station-idx")) || 0;
      function loadStation(idx, autoplay) {
        stationIdx = ((idx % STATIONS.length) + STATIONS.length) % STATIONS.length;
        audioEl.src = STATIONS[stationIdx].url;
        localStorage.setItem("showroom-station-idx", String(stationIdx));
        document.getElementById("station").value = String(stationIdx);
        if (autoplay) audioEl.play().catch(() => {});
      }
      let stationRetryTimer = null;
      audioEl.addEventListener("error", () => {
        clearTimeout(stationRetryTimer);
        stationRetryTimer = setTimeout(() => loadStation(stationIdx + 1, true), 8000);
      });

      async function requestWakeLock() {
        try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && !wakeLock) requestWakeLock();
      });

      function tickClock() {
        const d = new Date();
        document.getElementById("clock").textContent = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      }
      setInterval(tickClock, 15000);

      let hudTimer = null;
      function flashHud() {
        const hud = document.getElementById("hud");
        hud.classList.add("visible");
        document.body.classList.add("show-cursor");
        clearTimeout(hudTimer);
        hudTimer = setTimeout(() => {
          hud.classList.remove("visible");
          document.body.classList.remove("show-cursor");
        }, 4500);
      }
      ["mousemove", "keydown", "pointerdown"].forEach((ev) => window.addEventListener(ev, flashHud));

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") advance();
        else if (e.key === "ArrowLeft") prev();
        else if (e.key === " " || e.key === "Enter") togglePlay();
        else if (e.key === "m" || e.key === "M") toggleMute();
      });

      function toggleMute() {
        audioEl.muted = !audioEl.muted;
        document.getElementById("btn-mute").innerHTML = audioEl.muted ? "&#128263;" : "&#128266;";
        localStorage.setItem("showroom-muted", audioEl.muted ? "1" : "0");
      }

      function wireHud() {
        document.getElementById("btn-next").addEventListener("click", advance);
        document.getElementById("btn-prev").addEventListener("click", prev);
        document.getElementById("btn-play").addEventListener("click", () => togglePlay());
        document.getElementById("btn-mute").addEventListener("click", toggleMute);

        const select = document.getElementById("station");
        STATIONS.forEach((s, i) => {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = s.name;
          select.appendChild(opt);
        });
        select.value = String(stationIdx);
        select.addEventListener("change", () => loadStation(Number(select.value), true));

        const vol = document.getElementById("vol");
        const savedVol = localStorage.getItem("showroom-volume");
        audioEl.volume = savedVol !== null ? Number(savedVol) : 0.5;
        vol.value = String(audioEl.volume);
        vol.addEventListener("input", () => {
          audioEl.volume = Number(vol.value);
          localStorage.setItem("showroom-volume", vol.value);
        });

        audioEl.muted = localStorage.getItem("showroom-muted") === "1";
        document.getElementById("btn-mute").innerHTML = audioEl.muted ? "&#128263;" : "&#128266;";
      }

      function start() {
        document.getElementById("start-overlay").classList.add("hidden");
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) { try { Promise.resolve(req.call(el)).catch(() => {}); } catch (_) {} }
        requestWakeLock();
        loadStation(stationIdx, true);
        tickClock();
        advance();
        flashHud();
      }

      async function fetchRealizzazioni() {
        try {
          const res = await fetch("/api/showroom/photos", { cache: "no-store" });
          const json = await res.json();
          return (json.items || []).filter((item) => item.category === "realizzazioni" && item.attachment?.url);
        } catch (_) {
          return [];
        }
      }

      async function init() {
        wireHud();
        try {
          const [manifest, collections, settings] = await Promise.all([
            fetch("/showroom-content/manifest.json", { cache: "no-store" }).then((r) => r.json()),
            fetch("/showroom-content/catalog.json", { cache: "no-store" }).then((r) => r.json()),
            fetch("/api/showroom/settings", { cache: "no-store" }).then((r) => r.json()).catch(() => ({ activeCollections: null })),
          ]);
          data.brand = manifest.brand || {};
          data.coolStuff = manifest.coolStuff || [];
          data.collections = collections;
          data.activeCollectionIds = settings.activeCollections || null;
        } catch (_) {
          data = { brand: { name: "Prato Sintetico Italia", tagline: "", logo: "/showroom-content/logo.png" }, coolStuff: [], collections: [], activeCollectionIds: null, realizzazioni: [] };
        }
        data.realizzazioni = await fetchRealizzazioni();
        sequence = buildSequence(data);
        document.getElementById("btn-start").addEventListener("click", start, { once: true });
        setInterval(async () => {
          const fresh = await fetchRealizzazioni();
          if (fresh.length) data.realizzazioni = fresh;
        }, 5 * 60 * 1000);
      }
      init();
    </script>
  </body>
</html>
